[package]
name = "ocr-studio"
version = "0.1.0"
description = "OCR Studio - 开箱即用 OCR / 找字 / 找图 桌面工具"
authors = ["you"]
edition = "2021"

[lib]
name = "ocr_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol 必须开：它决定 tauri::generate_context! 是否把前端资源嵌入二进制。
# 不开的话，即使 --release 构建，窗口也会去加载 build.devUrl（默认 http://localhost:1420），
# 用户双击 exe 只能看到「localhost 拒绝连接」或纯白窗口。
# 官方 `pnpm tauri build` 会自动带上这个 feature，裸 `cargo build` 不会。
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 基础工具
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 把 tauri / wry / webview2 内部用 log crate 打的日志桥接到 tracing，
# 否则 WebView 创建失败时的真实原因会被静默丢弃（只在白屏现象上体现）。
tracing-log = "0.2"

# 图像与张量
image = "0.25"
ndarray = "0.17"

# 本地 HTTP 服务
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }

# 接口入参解码
base64 = "0.22"
regex = "1"

# 推理引擎：ort (onnxruntime 2.x)
#
# 为什么用 load-dynamic：
#   本机只有 onnxruntime.dll（来自 onnxruntime-directml 1.24.3），没有 MSVC 导入库 .lib。
#   ort-sys 默认走链接路线（要么构建期下载，要么找 onnxruntime.lib），都不适用。
#   load-dynamic 让 ort-sys 构建脚本直接跳过链接，运行时用 libloading 加载 DLL，
#   并通过 ORT_DYLIB_PATH 指定位置（未设置则按 DLL 搜索顺序找 onnxruntime.dll）。
#
# api-24：向 DLL 请求 ONNX Runtime API v24，与 1.24.3 对应。
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "api-24",
    "tracing",
    "load-dynamic",
    "directml",
] }
imageproc = "0.27.0"

# Windows 原生 API：截图（GDI BitBlt / PrintWindow）、窗口枚举、DPI 感知、
# 以及「添加检测模型」用的系统文件选择框（GetOpenFileNameW）
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls_Dialogs",
]

# 注：windows 依赖在截图/句柄里程碑（M2）加入并单独验证编译

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

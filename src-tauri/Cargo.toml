[package]
name = "ocr-studio"
version = "0.1.0"
description = "OCR Studio - 开箱即用 OCR / 找字 / 找图 桌面工具"
authors = ["you"]
edition = "2021"

[lib]
name = "ocr_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 基础工具
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 图像与张量
image = "0.25"
ndarray = "0.17"

# 本地 HTTP 服务
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }

# 接口入参解码
base64 = "0.22"
regex = "1"

# 推理引擎：ort (onnxruntime 2.x)
#
# 为什么用 load-dynamic：
#   本机只有 onnxruntime.dll（来自 onnxruntime-directml 1.24.3），没有 MSVC 导入库 .lib。
#   ort-sys 默认走链接路线（要么构建期下载，要么找 onnxruntime.lib），都不适用。
#   load-dynamic 让 ort-sys 构建脚本直接跳过链接，运行时用 libloading 加载 DLL，
#   并通过 ORT_DYLIB_PATH 指定位置（未设置则按 DLL 搜索顺序找 onnxruntime.dll）。
#
# api-24：向 DLL 请求 ONNX Runtime API v24，与 1.24.3 对应。
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "api-24",
    "tracing",
    "load-dynamic",
    "directml",
] }
imageproc = "0.27.0"

# 注：windows 依赖在截图/句柄里程碑（M2）加入并单独验证编译

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
